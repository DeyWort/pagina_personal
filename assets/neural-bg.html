<!-- Fondo decorativo: red neuronal interactiva.
     Canvas fijo detrás del contenido (z-index:-1). Los nodos se activan cuando
     el cursor pasa cerca y emiten un pulso al presionar. Los colores se leen de
     los tokens CSS (--net-node/--net-edge/--net-active), así que se adaptan a
     los modos claro y oscuro. Se incluye con include-after-body (_quarto.yml). -->
<script>
(function () {
  var body = document.body;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var cv = document.createElement('canvas');
  cv.className = 'neural-bg';
  cv.setAttribute('aria-hidden', 'true');
  body.appendChild(cv);
  var ctx = cv.getContext('2d');

  var DPR = 1, W = 0, H = 0, nodes = [], pulses = [];
  var pointer = { x: -1e5, y: -1e5 };
  var COL = {};

  // Acepta hex (#rgb/#rrggbb) o rgb()/rgba(); devuelve componentes 0-255.
  function parseColor(s, fb) {
    s = (s || '').trim();
    if (s.charAt(0) === '#') {
      var h = s.slice(1);
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      var n = parseInt(h, 16);
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    }
    var m = s.match(/(\d+(?:\.\d+)?)\D+(\d+(?:\.\d+)?)\D+(\d+(?:\.\d+)?)/);
    return m ? { r: +m[1], g: +m[2], b: +m[3] } : fb;
  }
  function rgba(c, a) { return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + a + ')'; }

  function readColors() {
    var cs = getComputedStyle(body);
    function v(n) { return (cs.getPropertyValue(n) || '').trim(); }
    COL = {
      node: parseColor(v('--net-node'), { r: 59, g: 76, b: 202 }),
      edge: parseColor(v('--net-edge'), { r: 120, g: 130, b: 150 }),
      active: parseColor(v('--net-active'), { r: 59, g: 76, b: 202 })
    };
  }

  var LINK = 145, RADIUS = 135, NODE_R = 2.2, ACTIVE_R = 4.6;

  function populate() {
    var count = Math.max(28, Math.min(80, Math.round((window.innerWidth * window.innerHeight) / 26000)));
    nodes = [];
    for (var i = 0; i < count; i++) {
      nodes.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.22, vy: (Math.random() - 0.5) * 0.22,
        a: 0
      });
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width = Math.floor(window.innerWidth * DPR);
    H = cv.height = Math.floor(window.innerHeight * DPR);
    cv.style.width = window.innerWidth + 'px';
    cv.style.height = window.innerHeight + 'px';
    populate();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    var linkPx = LINK * DPR, radiusPx = RADIUS * DPR;
    var i, j, n, d, dx, dy, target;

    for (i = 0; i < nodes.length; i++) {
      n = nodes[i];
      dx = n.x - pointer.x; dy = n.y - pointer.y;
      d = Math.sqrt(dx * dx + dy * dy);
      target = d < radiusPx ? (1 - d / radiusPx) : 0;
      for (j = 0; j < pulses.length; j++) {
        var p = pulses[j];
        var pd = Math.sqrt((n.x - p.x) * (n.x - p.x) + (n.y - p.y) * (n.y - p.y));
        if (pd < radiusPx * 1.6) target = Math.max(target, (1 - pd / (radiusPx * 1.6)) * p.t);
      }
      n.a += (target - n.a) * 0.12;
    }

    ctx.lineWidth = DPR;
    for (i = 0; i < nodes.length; i++) {
      for (j = i + 1; j < nodes.length; j++) {
        dx = nodes[i].x - nodes[j].x; dy = nodes[i].y - nodes[j].y;
        d = Math.sqrt(dx * dx + dy * dy);
        if (d < linkPx) {
          var act = Math.max(nodes[i].a, nodes[j].a);
          ctx.strokeStyle = rgba(act > 0.05 ? COL.active : COL.edge, (1 - d / linkPx) * (0.10 + act * 0.5));
          ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(nodes[j].x, nodes[j].y); ctx.stroke();
        }
      }
    }

    for (i = 0; i < nodes.length; i++) {
      n = nodes[i];
      var r = (NODE_R + n.a * (ACTIVE_R - NODE_R)) * DPR;
      ctx.fillStyle = n.a > 0.04 ? rgba(COL.active, 0.35 + n.a * 0.6) : rgba(COL.node, 0.5);
      ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.2832); ctx.fill();
    }
  }

  function step() {
    if (!reduce) {
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        n.x += n.vx * DPR; n.y += n.vy * DPR;
        if (n.x < 0 || n.x > W) n.vx *= -1;
        if (n.y < 0 || n.y > H) n.vy *= -1;
      }
    }
    for (var k = pulses.length - 1; k >= 0; k--) {
      pulses[k].t -= 0.02;
      if (pulses[k].t <= 0) pulses.splice(k, 1);
    }
    draw();
    requestAnimationFrame(step);
  }

  window.addEventListener('pointermove', function (e) {
    pointer.x = e.clientX * DPR; pointer.y = e.clientY * DPR;
  }, { passive: true });
  window.addEventListener('pointerdown', function (e) {
    pulses.push({ x: e.clientX * DPR, y: e.clientY * DPR, t: 1 });
    if (pulses.length > 6) pulses.shift();
  }, { passive: true });
  window.addEventListener('pointerleave', function () { pointer.x = -1e5; pointer.y = -1e5; });
  window.addEventListener('resize', resize);

  // Recolorear cuando Quarto alterna el tema (cambia la clase en <body>).
  new MutationObserver(function () { readColors(); }).observe(body, { attributes: true, attributeFilter: ['class'] });

  readColors();
  resize();
  requestAnimationFrame(step);

  // Hook de depuración para las pruebas.
  window.__neural = {
    count: function () { return nodes.length; },
    activeCount: function () { return nodes.filter(function (n) { return n.a > 0.3; }).length; },
    setPointer: function (x, y) { pointer.x = x * DPR; pointer.y = y * DPR; }
  };
})();
</script>
