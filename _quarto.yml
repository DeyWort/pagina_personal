project:
  type: website
  output-dir: _site
  # Solo se renderizan páginas .qmd. Se excluye docs/ (documentos internos del
  # proyecto) para que no se publiquen ni entren al buscador del sitio.
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!docs/"

website:
  
  site-url: "https://deywort.github.io/pagina_personal"
  navbar:
    left:
      - href: index.qmd
        text: Inicio
      - href: proyectos/index.qmd
        text: Proyectos
      - href: blog/index.qmd
        text: Blog
    right:
      - icon: github
        href: https://github.com/DeyWort
      - icon: linkedin
        href: https://www.linkedin.com/in/guillermo-pineda-ramirez/

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: assets/styles.css
    include-after-body:
      - assets/neural-bg.html
      - assets/lightbox.html
    toc: false
    lang: es