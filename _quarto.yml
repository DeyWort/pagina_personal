project:
  type: website
  output-dir: _site
  # Los documentos de docs/ (constitución y especificación) viven en el repo
  # pero NO se publican ni entran al buscador del sitio. Solo se renderizan
  # páginas .qmd; excluimos docs/ de forma explícita.
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!docs/"

website:
  
  site-url: "https://deywort.github.io/pagina_personal"
  navbar:
    left:
      - href: index.qmd
        text: Inicio
      - href: proyectos/index.qmd
        text: Proyectos
      - href: blog/index.qmd
        text: Blog
    right:
      - icon: github
        href: https://github.com/DeyWort
      - icon: linkedin
        href: https://www.linkedin.com/in/guillermo-pineda-ramirez/

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: assets/styles.css
    include-after-body:
      - assets/neural-bg.html
      - assets/lightbox.html
    toc: false
    lang: es